services:
  wordpress:
    image: ghcr.io/weblankanlk-web/wordpress:7.4-php
    container_name: wordpress
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wl-wordpress-user
      WORDPRESS_DB_PASSWORD: wladmin@123
      WORDPRESS_DB_NAME: wlwordpressdb
      REDIS_HOST: redis
    #volumes:
      #- /opt/www/wordpress:/var/www/html
      #- /opt/www/docker-compose/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    deploy:
      #replicas: 2  
      resources:
        limits:
          memory: 1.2G
          cpus: "0.8"
        reservations:
          memory: 1G
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-admin"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: always


  db:
    image: mysql:8.0
    container_name: wordpress_db
    environment:
      MYSQL_ROOT_PASSWORD: wladmin@123+
      MYSQL_DATABASE: wlwordpressdb
      MYSQL_USER: wl-wordpress-user
      MYSQL_PASSWORD: wladmin@123
    #volumes:
      #- /opt/www/mysql:/var/lib/mysql
    deploy:
      #replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "0.6"
        reservations:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: always
          
  redis:
    image: redis:latest
    container_name: redis
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
        reservations:
          memory: 128M
          cpus: "0.2"